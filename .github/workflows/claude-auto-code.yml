name: Claude Auto Code

# Issue に auto-code ラベルを貼ると、Claude Code が実装して PR を作る
on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'auto-code'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Issue のタイトル・本文は誰でも書けるので、${{ }} で run に直接埋め込まず
      # 環境変数経由で渡す（シェルインジェクション対策）
      - name: Run Claude Code
        env:
          # Pro / Max のサブスクリプションで認証する（claude setup-token で発行したトークン）
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # 貼り付け時に混ざった改行・空白を取り除き、値は出さずに形式だけ確認する
          TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          echo "token length: ${#TOKEN} (removed whitespace: $(( ${#CLAUDE_CODE_OAUTH_TOKEN} - ${#TOKEN} )))"
          case "$TOKEN" in
            sk-ant-oat*) echo "token prefix: ok" ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN が sk-ant-oat で始まっていません。claude setup-token のトークンを登録し直してください"; exit 1 ;;
          esac
          export CLAUDE_CODE_OAUTH_TOKEN="$TOKEN"

          claude -p "以下の Issue を解決してください。

          タイトル: $ISSUE_TITLE

          本文:
          $ISSUE_BODY

          npm run build と npm run lint を実行し、両方成功することを確認してください。" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run build),Bash(npm run lint),Bash(git status),Bash(git diff:*)"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: resolve issue #${{ github.event.issue.number }}"
          title: "Auto-fix: ${{ github.event.issue.title }}"
          body: "Closes #${{ github.event.issue.number }} by Claude Code"
          branch: "auto-fix-${{ github.event.issue.number }}"
